# Render Blueprint: 발표 사이트(site/)만 정적 사이트로 배포한다.
# rootDir을 site로 두는 이유: 저장소 최상위의 requirements.txt를 Render가 발견하면
# 파이썬 패키지(flyvis 등)를 자동 설치하려다 실패한다. 사이트는 HTML/JS뿐이라 설치가 필요 없다.
services:
  - type: web
    name: flyvis-decoding
    runtime: static
    rootDir: site
    buildCommand: echo "no build"
    staticPublishPath: .
